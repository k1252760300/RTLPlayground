name: Build firmware
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install make gcc sdcc xxd python3 libjson-c-dev zlib1g-dev -y

      - name: Run the host‑side unit tests
        run: make -C test

      - name: Build main firmware FG_4GT_2SX_V2_0
        run: make clean && make CI=1 MACHINE="FG_4GT_2SX_V2_0"

      - name: List output dir for debug
        run: ls -la output/FG_4GT_2SX_V2_0/

      - name: Upload hex artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RTLPlayground-FG_4GT_2SX_V2_0
          path: |
            output/FG_4GT_2SX_V2_0/*.hex
